# Render Blueprint for the CashPilot AI FastAPI backend.
# Deploy: render.com/deploy or "New +" -> "Blueprint" -> point at this repo.
#
# Persistence: the backend runs on Postgres (Neon) via DATABASE_URL, so data
# survives deploys/restarts on any Render plan — no persistent disk needed.
# Create a Neon project (neon.tech), copy its connection string, and set it
# as DATABASE_URL below in the Render dashboard. The build step runs Alembic
# migrations before starting the app, so a fresh Neon database gets its
# schema created automatically on first deploy.
services:
  - type: web
    name: cashpilot-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET_KEY
        generateValue: true
      # Google Gemini key for AI features (extraction, insights, chat,
      # negotiation copy). Set this in the Render dashboard — it's a
      # secret and intentionally not stored in this file.
      - key: GOOGLE_API_KEY
        sync: false
      # Comma-separated list of allowed frontend origins for CORS.
      # Set this to your Vercel production URL (and any custom domain).
      - key: CORS_ORIGINS
        value: https://cashpilot-ai.vercel.app
      # Used to build the password-reset link sent to users.
      - key: FRONTEND_URL
        value: https://cashpilot-ai.vercel.app
      # Your Neon Postgres connection string, e.g.:
      #   postgresql://<user>:<password>@<host>/<db>?sslmode=require
      # Set this in the Render dashboard — it's a secret and intentionally
      # not stored in this file. Falls back to a local SQLite file if unset,
      # which is only useful for local development, never production.
      - key: DATABASE_URL
        sync: false
