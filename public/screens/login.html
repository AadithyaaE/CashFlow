            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

            animation: cp-fade-up 0.5s ease both;
        }
        .cp-spinner {
            border: 2px solid rgba(255,255,255,0.4);

<body class="bg-background text-on-surface font-body-md hero-gradient min-h-screen">
<nav class="w-full sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant h-16">
<div class="max-w-container-max mx-auto px-lg flex justify-between items-center h-full">
<a href="/screens/index.html" class="font-headline-md text-headline-md font-bold text-primary">CashPilot AI</a>
<a href="/screens/signup.html" class="font-label-md text-on-surface-variant hover:text-primary transition-colors">Don't have an account? <span class="text-primary font-semibold">Sign up</span></a>
</div>
</nav>

<main class="flex items-center justify-center px-md py-2xl min-h-[calc(100vh-64px)]">
<div class="glass-card cp-animate-in rounded-3xl p-8 md:p-10 shadow-2xl w-full max-w-md relative overflow-hidden">
<div class="absolute -top-10 -right-10 w-40 h-40 bg-primary-fixed/30 rounded-full blur-3xl -z-10"></div>
<div class="absolute -bottom-10 -left-10 w-40 h-40 bg-tertiary-fixed/30 rounded-full blur-3xl -z-10"></div>

<div class="mb-8">
<div class="w-12 h-12 rounded-2xl bg-primary flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-on-primary">bolt</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Welcome back</h1>
<p class="text-on-surface-variant">Sign in to continue to CashPilot AI</p>
</div>

<div id="formError" class="hidden mb-lg bg-error-container text-on-error-container text-sm rounded-xl px-4 py-3 flex items-start gap-2">
<span class="material-symbols-outlined text-[18px] mt-px">error</span>
<span id="formErrorText"></span>
</div>

<form id="loginForm" class="space-y-5" novalidate>

<div>
<label class="block mb-2 font-label-md text-on-surface" for="email">Email</label>
<input
    id="email"
    name="email"
    type="email"
    autocomplete="email"
    class="w-full rounded-xl border border-outline-variant px-4 py-3 bg-white/70 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
    placeholder="you@company.com"
>
<p class="mt-1 text-xs text-error hidden" data-error-for="email"></p>
</div>

<div>
<div class="flex items-center justify-between mb-2">
<label class="font-label-md text-on-surface" for="password">Password</label>
<a href="/screens/forgot-password.html" class="font-label-md text-primary hover:underline">Forgot password?</a>
</div>
<div class="relative">
<input
    id="password"
    name="password"
    type="password"
    autocomplete="current-password"
    class="w-full rounded-xl border border-outline-variant px-4 py-3 pr-12 bg-white/70 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
    placeholder="Enter your password"
>
<button type="button" id="togglePassword" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary" tabindex="-1" aria-label="Show password">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<p class="mt-1 text-xs text-error hidden" data-error-for="password"></p>
</div>

<label class="flex items-center gap-sm cursor-pointer select-none">
<input id="rememberMe" type="checkbox" checked class="rounded border-outline-variant text-primary focus:ring-primary h-4 w-4">
<span class="font-body-sm text-on-surface-variant">Remember me on this device</span>
</label>

<button
    type="submit"
    id="submitBtn"
    class="w-full bg-primary text-on-primary py-3 rounded-xl font-headline-md font-semibold hover:bg-primary/90 active:scale-[0.99] transition-all flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
<span id="submitLabel">Sign In</span>
</button>

</form>

<p class="mt-8 text-center text-sm text-on-surface-variant">
Don't have an account?
<a href="/screens/signup.html" class="text-primary font-semibold hover:underline">Create one free</a>
</p>

</div>
</main>

<script src="api.js"></script>
<script>

CashPilot.redirectIfLoggedIn();
CashPilot.stripDevWidget();

const form = document.getElementById("loginForm");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const submitBtn = document.getElementById("submitBtn");
const submitLabel = document.getElementById("submitLabel");
const formError = document.getElementById("formError");
const formErrorText = document.getElementById("formErrorText");

document.getElementById("togglePassword").addEventListener("click", (e) => {

    const btn = e.currentTarget;
    const icon = btn.querySelector(".material-symbols-outlined");
    const isHidden = passwordInput.type === "password";

    passwordInput.type = isHidden ? "text" : "password";
    icon.textContent = isHidden ? "visibility_off" : "visibility";
    btn.setAttribute("aria-label", isHidden ? "Hide password" : "Show password");

});

function setFieldError(fieldId, message) {

    const input = document.getElementById(fieldId);
    const errorEl = document.querySelector(`[data-error-for="${fieldId}"]`);

    if (message) {
        input.classList.add("border-error");
        errorEl.textContent = message;
        errorEl.classList.remove("hidden");
    } else {
        input.classList.remove("border-error");
        errorEl.classList.add("hidden");
    }

}

function clearErrors() {

    formError.classList.add("hidden");
    setFieldError("email", "");
    setFieldError("password", "");

}

function validate() {

    let valid = true;

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    if (!email) {
        setFieldError("email", "Email is required");
        valid = false;
    } else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setFieldError("email", "Enter a valid email address");
        valid = false;
    }

    if (!password) {
        setFieldError("password", "Password is required");
        valid = false;
    }

    return valid;

}

function setLoading(isLoading) {

    submitBtn.disabled = isLoading;

    submitLabel.innerHTML = isLoading
        ? '<span class="cp-spinner"></span> Signing in…'
        : "Sign In";

    submitBtn.classList.toggle("flex", true);

}

form.addEventListener("submit", async (e) => {

    e.preventDefault();
    clearErrors();

    if (!validate()) return;

    setLoading(true);

    try {

        const response = await fetch(CashPilot.API_URL + "/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                email: emailInput.value.trim(),
                password: passwordInput.value,
            }),
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Invalid email or password");
        }

        CashPilot.setToken(data.access_token, document.getElementById("rememberMe").checked);
        localStorage.setItem("user", data.name);

        submitLabel.innerHTML = '<span class="material-symbols-outlined text-[18px]">check_circle</span> Success! Redirecting…';

        setTimeout(() => {
            window.location.href = "/screens/dashboard.html";
        }, 500);

    } catch (err) {

        formErrorText.textContent = err.message || "Something went wrong. Please try again.";
        formError.classList.remove("hidden");
        setLoading(false);

    }

});

</script>
</body>
</html>
