<body class="bg-background text-on-surface font-body-md hero-gradient min-h-screen">
<nav class="w-full sticky top-0 z-50 bg-surface/80 backdrop-blur-md border-b border-outline-variant h-16">
<div class="max-w-container-max mx-auto px-lg flex justify-between items-center h-full">
<a href="/screens/index.html" class="font-headline-md text-headline-md font-bold text-primary">CashPilot AI</a>
<a href="/screens/login.html" class="font-label-md text-on-surface-variant hover:text-primary transition-colors">Back to <span class="text-primary font-semibold">Log in</span></a>
</div>
</nav>

<main class="flex items-center justify-center px-md py-2xl min-h-[calc(100vh-64px)]">
<div class="glass-card cp-animate-in rounded-3xl p-8 md:p-10 shadow-2xl w-full max-w-md relative overflow-hidden">
<div class="absolute -top-10 -right-10 w-40 h-40 bg-primary-fixed/30 rounded-full blur-3xl -z-10"></div>
<div class="absolute -bottom-10 -left-10 w-40 h-40 bg-tertiary-fixed/30 rounded-full blur-3xl -z-10"></div>

<div id="requestView">

<div class="mb-8">
<div class="w-12 h-12 rounded-2xl bg-primary flex items-center justify-center mb-lg">
<span class="material-symbols-outlined text-on-primary">lock_reset</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Reset your password</h1>
<p class="text-on-surface-variant">Enter your email and we'll send you a link to reset your password.</p>
</div>

<div id="formError" class="hidden mb-lg bg-error-container text-on-error-container text-sm rounded-xl px-4 py-3 flex items-start gap-2">
<span class="material-symbols-outlined text-[18px] mt-px">error</span>
<span id="formErrorText"></span>
</div>

<form id="forgotForm" class="space-y-5" novalidate>

<div>
<label class="block mb-2 font-label-md text-on-surface" for="email">Email</label>
<input
    id="email"
    name="email"
    type="email"
    autocomplete="email"
    class="w-full rounded-xl border border-outline-variant px-4 py-3 bg-white/70 focus:outline-none focus:ring-2 focus:ring-primary focus:border-primary transition-all"
    placeholder="you@company.com"
>
<p class="mt-1 text-xs text-error hidden" data-error-for="email"></p>
</div>

<button
    type="submit"
    id="submitBtn"
    class="w-full bg-primary text-on-primary py-3 rounded-xl font-headline-md font-semibold hover:bg-primary/90 active:scale-[0.99] transition-all flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
<span id="submitLabel">Send Reset Link</span>
</button>

</form>

</div>

<div id="successView" class="hidden text-center">
<div class="w-14 h-14 rounded-2xl bg-primary/10 flex items-center justify-center mb-lg mx-auto">
<span class="material-symbols-outlined text-primary text-3xl">mark_email_read</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-xs">Check your email</h1>
<p class="text-on-surface-variant">If an account exists for <span id="sentEmail" class="font-semibold text-on-surface"></span>, we've sent a link to reset your password. It expires in 30 minutes.</p>
</div>

<p class="mt-8 text-center text-sm text-on-surface-variant">
Remembered your password?
<a href="/screens/login.html" class="text-primary font-semibold hover:underline">Log in</a>
</p>

</div>
</main>

<script src="api.js"></script>
<script>

CashPilot.redirectIfLoggedIn();
CashPilot.stripDevWidget();

const form = document.getElementById("forgotForm");
const emailInput = document.getElementById("email");
const submitBtn = document.getElementById("submitBtn");
const submitLabel = document.getElementById("submitLabel");
const formError = document.getElementById("formError");
const formErrorText = document.getElementById("formErrorText");

function setFieldError(fieldId, message) {

    const input = document.getElementById(fieldId);
    const errorEl = document.querySelector(`[data-error-for="${fieldId}"]`);

    if (message) {
        input.classList.add("border-error");
        errorEl.textContent = message;
        errorEl.classList.remove("hidden");
    } else {
        input.classList.remove("border-error");
        errorEl.classList.add("hidden");
    }

}

function setLoading(isLoading) {

    submitBtn.disabled = isLoading;

    submitLabel.innerHTML = isLoading
        ? '<span class="cp-spinner"></span> Sending…'
        : "Send Reset Link";

}

form.addEventListener("submit", async (e) => {

    e.preventDefault();
    formError.classList.add("hidden");
    setFieldError("email", "");

    const email = emailInput.value.trim();

    if (!email) {
        setFieldError("email", "Email is required");
        return;
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setFieldError("email", "Enter a valid email address");
        return;
    }

    setLoading(true);

    try {

        const response = await fetch(CashPilot.API_URL + "/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ email }),
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Something went wrong. Please try again.");
        }

        document.getElementById("sentEmail").textContent = email;
        document.getElementById("requestView").classList.add("hidden");
        document.getElementById("successView").classList.remove("hidden");

    } catch (err) {

        formErrorText.textContent = err.message || "Something went wrong. Please try again.";
        formError.classList.remove("hidden");
        setLoading(false);

    }

});

</script>
