# Local development convenience only — NOT used for production deployment
# (Render builds the backend, Vercel builds the frontend, directly from their
# own Dockerfile/build config). Neon Postgres, AWS S3, and Gemini all stay
# external; no database service is defined here.
#
# The frontend talks to the backend directly from the browser (see
# public/screens/api.js), not container-to-container, so both services just
# need their ports published to the host — no shared network config beyond
# Compose's default is required.
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', res => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
